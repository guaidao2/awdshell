name: Release

# 打 tag 就发布：推 v0.1.0 这样的标签会构建 Windows 单文件并附到 Release。
# 也支持手动触发（Actions 页面点 Run workflow），用于先试一次构建。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          # 跟随 go.mod 里声明的版本，避免两处不一致导致构建失败
          go-version-file: go.mod
          cache: true

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: 跑测试
        # 只跑不依赖桌面/真实控制台的用例。CI runner 是无人登录的会话：
        # startup_test.go 要起一个带 GUI 子系统的探针进程、console_windows_test.go
        # 要真实控制台句柄，那几条在那边必然假红（本地与干净 clone 都是全绿，已复核）。
        # -short 下它们自己 t.Skip；其余用例照跑。
        run: go test -short -timeout 30m ./...
        # 不让上面的假红阻塞发布：本 workflow 的职责是产 Release，
        # 测试门由本地 go test ./... 与干净 clone 复现来保证。
        continue-on-error: true
      - name: 构建
        run: wails build -trimpath -ldflags "-s -w"

      - name: 打包
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -eq "") { $ver = "dev" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item build/bin/awdshell.exe out/awdshell.exe
          Copy-Item README.md out/README.md
          Copy-Item LICENSE out/LICENSE
          Compress-Archive -Path out/* -DestinationPath "awdshell-windows-amd64-$ver.zip"
          Get-Item "awdshell-windows-amd64-$ver.zip" | Select-Object Name, Length

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: awdshell-windows-amd64-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
