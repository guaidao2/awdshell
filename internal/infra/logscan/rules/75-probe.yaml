version: 1
meta:
  name: "表达式求值探测（只记分，不拦）"
  author: "donothack"
  category: scanner

# 背景（P6 验收时发现的真实案例，值得写清楚）：
#
# crackweb 的 SSTI 检测会发 `a=1999*1999` —— **不带任何模板语法**，
# 就是一个裸算术表达式。它判断的依据是"靶场把表达式算出来了"（响应里 3996001）。
# 也就是说它测的是"应用把用户输入当代码求值"，而不是模板注入语法本身。
#
# 为什么**不拦**：
#   裸算术在正常业务里并不罕见 —— `?resolution=1920*1080`、`?size=100*100`、
#   计算器类应用的 `?expr=1+1`。把它们拦掉换来的误报，比这条检测值钱得多。
#   真正能治本的是**响应侧**检测（响应里出现了求值结果），而本项目按设计
#   只做请求侧 —— 这条边界是有意划的，不是漏掉的。
#
# 所以给 2 分：**永远不够单独触发拦截**（阈值 5），但会进事件与类目统计，
# 运维在控制台里能看到"有人在拿表达式探这个接口"，进而给那个路径单独加严。
# 这是"能看见但不误伤"的折中。

rules:
  - id: PROBE-2001
    phase: 2
    severity: low
    category: scanner
    score: 2
    message: "参数值是纯算术表达式（表达式求值探测的典型形态，仅记分）"
    tags: [scanner, probe, expression, detect-only]
    targets:
      - collection: ARGS
    transforms:
      - urlDecode
      - trim
    operator:
      name: regex
      params:
        # 整个值就是 "两位以上数字 运算符 两位以上数字"：没有别的字符
        pattern: '^[0-9]{2,10}\s*[*+\-/]\s*[0-9]{2,10}$'
    test:
      positive:
        - "1999*1999"
        - "100+200"
        - "1024-512"
      negative:
        - "1920x1080"
        - "resolution 1920 * 1080 px"
        - "order-12345"
        - "2024-01-01"
        - "a*b"
