# 协议违规与畸形请求（请求侧）
#
# 这一组规则只看"请求本身是否合法"，不看参数语义。它们是检测引擎的第一道门，
# 也是误报最容易失控的地方 —— 因此凡是"某个头存在"这类弱信号，一律给低分 + log，
# 只有 NUL 字节、CRLF 注入、chunked 混淆这类"正常流量不可能出现"的形态才给高分。
version: 1
meta:
  name: "协议违规与畸形请求"
  author: "qingli"
  category: protocol

rules:

  # ── 超长输入 ────────────────────────────────────────────────────────
  - id: PROTO-1001
    phase: 1
    severity: medium
    category: protocol
    score: 3
    message: "请求行异常：URI 长度超出 8 KiB 上限"
    tags: [protocol, request-line, oversize]
    targets:
      - collection: REQUEST_URI_LENGTH
    operator:
      name: gt
      params:
        value: 8191
    action:
      type: log
    test:
      positive:
        - "9000"
      negative:
        - "64"
        - "2048"

  - id: PROTO-1002
    phase: 1
    severity: medium
    category: protocol
    score: 3
    message: "请求头异常：单个头部值长度超出 8 KiB"
    tags: [protocol, header, oversize]
    targets:
      - collection: REQUEST_HEADERS
    transforms:
      - length
    operator:
      name: gt
      params:
        value: 8192
    action:
      type: log
    test:
      positive:
        - ""
      negative:
        - "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        - "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"

  # ── 畸形字节 ────────────────────────────────────────────────────────
  - id: PROTO-1003
    phase: 2
    severity: high
    category: protocol
    score: 5
    message: "输入中含 NUL 字节（截断绕过特征）"
    tags: [protocol, null-byte, evasion]
    targets:
      - collection: ARGS
      - collection: REQUEST_URI
      - collection: REQUEST_BODY
      - collection: REQUEST_HEADERS
    operator:
      name: validateByteRange
      params:
        range: "1-255"
    test:
      positive:
        - "avatar.png\x00.php"
        - "admin\x00"
      negative:
        - "avatar.png"
        - "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

  # ── CRLF 注入 / 响应头拆分 ──────────────────────────────────────────
  # 变换链刻意不含 urlDecode：编码形态的 %0d%0a 正是要匹配的字面量。
  # 两条 \r\n 之类的短模式只作为补充（它们进不了预筛自动机，但规则被
  # 其它字面量触发时会一并匹配）。
  - id: PROTO-1004
    phase: 2
    severity: high
    category: protocol
    score: 5
    message: "参数或请求行中出现 CRLF 序列（响应头注入 / 请求头拆分特征）"
    tags: [protocol, crlf, header-injection, owasp-a03]
    targets:
      - collection: ARGS
      - collection: REQUEST_URI
      - collection: REQUEST_BODY
    transforms:
      - lowercase
    operator:
      name: pm
      params:
        patterns:
          - "%0d%0a"
          - "%0d%0a%0d%0a"
          - "%0d%0d"
          - "%0a%0d"
          - "%250d%250a"
          - "\r\nset-cookie"
          - "\r\ncontent-length"
          - "\r\nlocation"
          - "\r\nhost"
          - "\\r\\nset-cookie"
          - "\\r\\nlocation"
    test:
      positive:
        - "/account/login%0d%0aSet-Cookie:%20session=x"
        - "%0d%0aContent-Length:%200"
        - "next=%250d%250aLocation:%20http://evil.example/"
        - "x\r\nSet-Cookie: y=1"
      negative:
        - "https://shop.example.com/redirect?next=/account/orders"
        - "Special offer 100%0d off today only"
        - "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"

  # ── 方法与头部合法性 ────────────────────────────────────────────────
  - id: PROTO-1005
    phase: 1
    severity: medium
    category: protocol
    score: 4
    message: "请求方法非法或已禁用（不在允许列表内，含 TRACE）"
    tags: [protocol, method, trace, xst]
    targets:
      - collection: REQUEST_METHOD
    transforms:
      - trim
      - uppercase
    operator:
      name: not
      params:
        operator:
          name: regex
          params:
            pattern: "^(?:GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS|CONNECT|PROPFIND|PROPPATCH|MKCOL|COPY|MOVE|LOCK|UNLOCK|REPORT|SEARCH|MERGE|PURGE)$"
    action:
      type: log
    test:
      positive:
        - "FOO"
        - "TRACE"
        - "GETS"
      negative:
        - "GET"
        - "POST"
        - "OPTIONS"

  # ---- 已移除：请求走私（CL.TE / TE.CL）检测 ----
  #
  # 这里原本是一对 chain 规则：PROTO-1006 命中 Transfer-Encoding，
  # PROTO-1007 命中 Content-Length，两个都中即判走私。**它在本层不可能命中，
  # 所以删掉而不是留着** —— 死规则比没有规则更糟，它会让人以为"我在防请求走私"。
  #
  # 实测证据（internal/parser/headers_test.go 把它钉成了测试）：
  #   Go 的 net/http 在解析阶段就把 Transfer-Encoding 从 Header 里移走放进
  #   r.TransferEncoding，并且在 chunked 时**连 Content-Length 一起删掉**
  #   （ContentLength 变成 -1）。也就是说"CL 与 TE 同时存在"这件事
  #   在 handler 层根本不可观测。
  #
  # 风险评估：不可观测 ≠ 可被利用。Go 的服务器与 httputil.ReverseProxy 会按
  # 解析后的语义**重新编码**请求再发给上游，CL/TE 歧义不会传到后端。
  # 也就是说这一层是"把歧义归一化掉"，而不是"把走私检测出来"。
  # 要真正检测它，必须在 net/http 之前拦截原始字节。
  #
  # 需要防的是 WAF 前面还有一层会自己解释 CL/TE 的代理（如老 nginx）时的
  - id: PROTO-1009
    phase: 1
    severity: low
    category: protocol
    score: 2
    message: "Content-Encoding 声明了解码器不支持的编码（检测盲区）"
    tags: [protocol, content-encoding, bypass]
    targets:
      - collection: REQUEST_HEADERS
        selector: "content-encoding"
    transforms:
      - trim
      - lowercase
    operator:
      name: not
      params:
        operator:
          name: regex
          params:
            pattern: "^(?:gzip|deflate|br|zstd|identity)(?:\\s*,\\s*(?:gzip|deflate|br|zstd|identity))*$"
    action:
      type: log
    test:
      positive:
        - "compress"
        - "gzip;q=1.0"
        - "gzip, lzma"
      negative:
        - "gzip"
        - "gzip, deflate"
        - "br"
